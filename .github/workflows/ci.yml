# Peilige V1 — minimal CI.
# Verifies key files, JS syntax, static HTTP serving, Docker build,
# container /healthz and compose config. No npm, no build toolchain —
# the site is vanilla HTML/CSS/JS and stays that way.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Key files exist
        run: |
          for f in \
            index.html \
            css/style.css \
            js/sites.js \
            js/main.js \
            assets/logo/bjpl-logo.png \
            deploy/Dockerfile \
            deploy/docker-compose.yml \
            deploy/Caddyfile \
            README.md \
            SECURITY.md \
            docs/product/01_Peilige_PRD.md; do
            test -f "$f" || { echo "missing key file: $f"; exit 1; }
            echo "ok: $f"
          done

      - name: JS syntax check
        run: |
          node --check js/sites.js
          node --check js/main.js

      - name: index.html references its assets
        run: |
          for ref in css/style.css js/sites.js js/main.js; do
            grep -q "$ref" index.html || { echo "index.html does not reference $ref"; exit 1; }
            echo "ok: index.html references $ref"
          done

      - name: Static HTTP smoke test
        run: |
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          python3 -m http.server 8000 --bind 127.0.0.1 &
          SERVER_PID=$!

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            echo "static server did not become ready"
            exit 1
          fi

          for path in / /css/style.css /js/sites.js /js/main.js /assets/logo/bjpl-logo.png; do
            curl -fsS -o /dev/null -w "GET $path -> %{http_code}\n" "http://127.0.0.1:8000$path"
          done

  docker-checks:
    name: Docker checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f deploy/Dockerfile -t peilige-ci .

      - name: Container smoke test
        run: |
          cleanup() { docker rm -f peilige-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          # Mirror the production compose hardening (non-root image USER,
          # no-new-privileges, all caps dropped, read-only rootfs with
          # writable /config + /data tmpfs) so regressions surface in CI.
          docker run -d --name peilige-ci \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --read-only \
            --tmpfs /config --tmpfs /data \
            -p 18080:8080 peilige-ci

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:18080/healthz; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "container did not become ready"
            exit 1
          fi

          for path in / /healthz /assets/logo/bjpl-logo.png; do
            curl -fsS -o /dev/null -w "GET $path -> %{http_code}\n" "http://127.0.0.1:18080$path"
          done

          uid=$(docker exec peilige-ci id -u)
          echo "container runtime uid: $uid"
          if [ "$uid" = "0" ]; then
            echo "container must not run as root"
            exit 1
          fi

      - name: Security header regression
        run: |
          BASE=http://127.0.0.1:18080

          headers=$(curl -sSI "$BASE/")
          echo "$headers"

          require_header() {
            if ! echo "$headers" | grep -qi "^$1:"; then
              echo "missing required header: $1"
              exit 1
            fi
            echo "ok: $1 present"
          }
          require_header "Content-Security-Policy"
          require_header "X-Content-Type-Options"
          require_header "Referrer-Policy"
          require_header "X-Frame-Options"
          require_header "Permissions-Policy"

          if echo "$headers" | grep -qi "^Server:"; then
            echo "Server header must be absent"
            exit 1
          fi
          echo "ok: Server header absent"

          health=$(curl -sSI "$BASE/healthz")
          echo "$health"
          if ! echo "$health" | grep -qi "^Cache-Control: *no-store"; then
            echo "/healthz must stay Cache-Control: no-store"
            exit 1
          fi
          echo "ok: /healthz no-store"

          code=$(curl -sS -o /dev/null -w "%{http_code}" "$BASE/assets/logo/bjpl-logo.png")
          if [ "$code" != "200" ]; then
            echo "logo returned $code"
            exit 1
          fi
          echo "ok: logo 200"

      - name: Compose config validation
        run: docker compose -f deploy/docker-compose.yml config -q
