<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F4F8FB">
  <!-- 与 index.html 相同的本地 data-URI favicon，无外部依赖 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232E7CE4'/%3E%3Cstop offset='1' stop-color='%232FAE8B'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3C/svg%3E">
  <title>404 · Peilige — 培黎系列网站导航</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 与 index.html 相同的静态背景装饰 -->
  <div class="page-decor" aria-hidden="true">
    <span class="page-decor__glow page-decor__glow--a"></span>
    <span class="page-decor__glow page-decor__glow--b"></span>
    <span class="page-decor__dots"></span>
    <span class="page-decor__ring"></span>
    <span class="page-decor__pill"></span>
  </div>

  <header class="site-header">
    <div class="content site-header__inner">
      <p class="site-brand">Peilige</p>
    </div>
  </header>

  <!-- 复用现有样式类（intro / modal__enter），不新增任何内联样式，保持 CSP style-src 'self' -->
  <main class="content">
    <section class="intro">
      <p class="intro__eyebrow">Error 404</p>
      <h1 class="intro__title">页面不存在</h1>
      <p class="intro__lead">你访问的地址不存在或已被移动，可以从首页重新进入。</p>
      <p class="modal__actions"><a class="modal__enter" href="/">返回首页</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="content site-footer__inner">
      <p>Peilige · 北京培黎职业学院 Peili 系列网站</p>
    </div>
  </footer>
</body>
</html>
